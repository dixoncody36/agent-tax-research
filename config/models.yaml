# Agent role -> model assignment. Mix and match freely: each role is an
# independent slot. `provider: harness` means "whatever model the running
# harness gives this role" (Muse, Muse, Codex, Grok, OpenCode).
# `provider: foundry` calls an Azure AI Foundry deployment directly
# (headless runs). Keys/endpoints live in .env, never here.
#
# Roles (see AGENTS.md): orchestrator | fetch | decision | reviewer.
# Gates require fetch, decision, reviewer, and the human approver to be
# distinct run identities — distinct models are recommended, not required.

roles:
  orchestrator:
    provider: harness
    model: muse-wonder        # planning/dispatch judgment; never fetches
  fetch:
    provider: harness
    model: muse-glimmer       # high-volume evidence gathering
  decision:
    provider: harness
    model: muse-wonder        # interpretation judgment over evidence
  reviewer:
    provider: harness
    model: muse-wonder        # independent re-read; use a different run/model than decision where possible
  embedder:
    provider: foundry
    deployment: ${AZURE_AI_EMBEDDING_DEPLOYMENT:-}   # empty = embeddings deferred

# Example Foundry override for headless runs:
# roles:
#   fetch:    { provider: foundry, deployment: gpt-5-mini }
#   decision: { provider: foundry, deployment: gpt-5 }

# Meta Model API (Muse) — hackathon provider, OpenAI-compatible.
# `provider: meta` calls https://api.meta.ai/v1/chat/completions with
# $MODEL_API_KEY (.env.local). Runner: pnpm muse:api (ping|complete|budget).
# Every Muse-API call records an agent_run (tokens + cost when the rate
# card envs are set) and counts against MUSE_BUDGET_USD. A Muse-API run
# is a distinct run identity for the publish gates, like any harness run.
# Suggested hackathon mix (operator's $150 Muse credit):
# roles:
#   fetch:    { provider: meta, model: muse-spark-1.3 }   # evidence triage/extraction drafts
#   reviewer: { provider: meta, model: muse-spark-1.3 }   # independent second pair of eyes
# orchestrator/decision stay on the harness (Muse) by default.
providers:
  meta:
    base: ${META_MODEL_API_BASE:-https://api.meta.ai/v1}
    apiKeyEnv: MODEL_API_KEY
    models: [muse-spark-1.3, muse-spark-1.2, muse-spark-1.1]
